[package]
name = "delirium-room"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mimalloc = { version = "0.1", default-features = false }
delirium = { path = "../delirium", features = ["bevy"] }
delirium-data = { path = "../delirium-data" }
# Only the engine parts the room uses (no animation, sprites, UI, picking or text): a smaller, quicker build.
bevy = { version = "=0.18.1", default-features = false, features = [
    "default_app", "std", "bevy_sprite", "bevy_sprite_render", "multi_threaded", "bevy_winit", "x11", "wayland", "bevy_gilrs",
    "bevy_render", "bevy_core_pipeline", "bevy_post_process", "bevy_anti_alias", "bevy_pbr", "bevy_light", "bevy_gizmos_render",
    "bevy_camera", "bevy_color", "bevy_gizmos", "bevy_image", "bevy_mesh", "bevy_shader", "bevy_mikktspace",
    "hdr", "png", "jpeg", "ktx2", "zstd_rust", "tonemapping_luts", "smaa_luts", "bevy_gltf", "scene", "bevy_audio", "experimental_pbr_pcss",
] }
bevy_egui = { version = "=0.39.1", default-features = false, features = ["manage_clipboard", "default_fonts", "render"] }
# bevy_egui reads the clipboard through arboard, which only talks to X11 unless this is on: without it, pasting on a Wayland session (most Linux desktops) finds nothing.
arboard = { version = "3.2", features = ["wayland-data-control"] }
rapier3d = "0.36.1"
anyhow = "1"
texpresso = "2.0.2"

[features]
# Portal mode: Portal 2's portal gun, with your own Portal 2 install (none of its files are included). On by default.
default = ["portal"]
portal = ["delirium/portal"]
