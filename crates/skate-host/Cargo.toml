[package]
name = "skate-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std", "multi_threaded", "bevy_log"] }
skate-core = { path = "../skate-core" }
skate-data = { path = "../skate-data" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
