[workspace]
members = ["crates/delirium-data", "crates/delirium", "crates/delirium-sdk", "crates/delirium-room", "crates/skate-core", "crates/skate-data", "crates/skate-host", "crates/skate-hud"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[profile.dev]
opt-level = 3

# DLSS with the camera's viewport off the window's corner (the dock): the offset passed through; PCSS soft shadows sized by the sun (vendor/).
[patch.crates-io]
dlss_wgpu = { path = "vendor/dlss_wgpu" }
bevy_anti_alias = { path = "vendor/bevy_anti_alias" }
bevy_pbr = { path = "vendor/bevy_pbr" }
# Ray tracing with the camera's viewport off the window's corner: the screen textures read at the view's offset.
bevy_solari = { path = "vendor/bevy_solari" }
